# Build on push to main, sync dist/ to the S3 site, invalidate CloudFront (D9).
# Needs three repository secrets/variables:
#   AWS_ROLE_ARN            IAM role trusted by GitHub OIDC (no long-lived keys)
#   S3_BUCKET               bucket that backs the site
#   CLOUDFRONT_DISTRIBUTION distribution id
# and one variable S3_PREFIX (e.g. "dream" for blog.floriniancu.ro/dream, or "" for a subdomain bucket).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - name: Sync to S3
        run: |
          PREFIX="${{ vars.S3_PREFIX }}"
          DEST="s3://${{ secrets.S3_BUCKET }}/${PREFIX:+$PREFIX/}"
          aws s3 sync dist/ "$DEST" --delete --cache-control "public,max-age=300"
      - name: Invalidate CloudFront
        run: |
          PREFIX="${{ vars.S3_PREFIX }}"
          aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION }}" --paths "/${PREFIX:+$PREFIX/}*"
